name: Check upstream releases

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:       # Manual trigger for testing

env:
  LLAMA_CPP_REPO: ggml-org/llama.cpp
  IMAGE_NAME: llama-cpp-embed-nomic

permissions:
  contents: write

jobs:
  check-llama-cpp:
    runs-on: ubuntu-24.04-arm  # Native ARM64
    steps:
      - name: Get latest upstream release tag
        id: upstream
        run: |
          echo "=== Upstream release check ==="
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Repository: ${{ env.LLAMA_CPP_REPO }}"
          echo ""
          
          RESPONSE=$(curl -sf "https://api.github.com/repos/${{ env.LLAMA_CPP_REPO }}/releases?per_page=20")
          if [ $? -ne 0 ]; then
            echo "ERROR: Failed to fetch releases from GitHub API"
            echo "URL: https://api.github.com/repos/${{ env.LLAMA_CPP_REPO }}/releases?per_page=20"
            exit 1
          fi

          # llama.cpp also publishes versioned releases (v0.x.y). We only build
          # bNNNN build-number tags, so filter for those explicitly.
          TAG=$(echo "$RESPONSE" | jq -r '.[].tag_name' | grep -E '^b[0-9]+$' | head -1)
          if [ -z "$TAG" ]; then
            echo "ERROR: No bNNNN-format release found in last 20 releases"
            echo "$RESPONSE" | jq -r '.[].tag_name'
            exit 1
          fi

          PUBLISHED=$(echo "$RESPONSE" | jq -r --arg t "$TAG" '.[] | select(.tag_name==$t) | .published_at' | head -1)
          URL=$(echo "$RESPONSE" | jq -r --arg t "$TAG" '.[] | select(.tag_name==$t) | .html_url' | head -1)

          echo "Upstream tag: $TAG"
          echo "Published: $PUBLISHED"
          echo "Release URL: $URL"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo ""

      - name: Get last built tag from GHCR
        id: builtin
        run: |
          echo "=== GHCR tag check ==="
          echo "Registry: ghcr.io"
          echo "Image: ${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"
          echo ""
          
          TAGS=$(curl -sf "https://ghcr.io/v2/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tags/list" 2>/dev/null || echo "")
          
          if [ -z "$TAGS" ]; then
            echo "No existing tags found in GHCR (first build or image not yet published)"
            echo "tag=none" >> "$GITHUB_OUTPUT"
            echo ""
            exit 0
          fi
          
          echo "Raw tags response:"
          echo "$TAGS" | jq -r '.tags[]' 2>/dev/null || echo "$TAGS"
          echo ""
          
          BUILT=$(echo "$TAGS" | grep -oP 'b[0-9]+' | sort -V | tail -1)
          echo "Latest built tag: ${BUILT:-none}"
          echo "tag=${BUILT:-none}" >> "$GITHUB_OUTPUT"
          echo ""

      - name: Compare tags
        if: always()
        run: |
          echo "=== Tag comparison ==="
          UPSTREAM="${{ steps.upstream.outputs.tag }}"
          BUILT="${{ steps.builtin.outputs.tag }}"
          echo "Upstream: $UPSTREAM"
          echo "Built:    $BUILT"
          
          if [ "$UPSTREAM" = "$BUILT" ]; then
            echo "Status: UP TO DATE"
          else
            echo "Status: NEW RELEASE AVAILABLE"
          fi
          echo ""

      - name: Trigger build if new release
        if: steps.upstream.outputs.tag != steps.builtin.outputs.tag
        run: |
          echo "=== Triggering build ==="
          TAG="${{ steps.upstream.outputs.tag }}"
          
          PAYLOAD=$(jq -n \
            --arg tag "$TAG" \
            '{event_type: "llama-cpp-release", client_payload: {tag: $tag}}')
          
          echo "Dispatch payload:"
          echo "$PAYLOAD" | jq .
          echo ""
          echo "Target: ${{ github.repository }}"
          echo "Event type: llama-cpp-release"
          echo "Tag: $TAG"
          echo ""
          
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d "$PAYLOAD")
          
          if [ "$HTTP_CODE" = "204" ]; then
            echo "Build triggered successfully (HTTP $HTTP_CODE)"
          else
            echo "ERROR: Failed to trigger build (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: No new release
        if: steps.upstream.outputs.tag == steps.builtin.outputs.tag
        run: |
          echo "=== No action needed ==="
          echo "Current release: ${{ steps.upstream.outputs.tag }}"
          echo "Already built and published"
