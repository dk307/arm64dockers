name: Check ncnn releases

on:
  schedule:
    - cron: '0 7 * * *'  # Daily at 07:00 UTC (offset from llama.cpp check)
  workflow_dispatch:       # Manual trigger for testing

env:
  NCNN_REPO: Tencent/ncnn
  IMAGE_NAME: yolo-rest

permissions:
  contents: read

jobs:
  check-ncnn:
    runs-on: ubuntu-24.04-arm  # Native ARM64
    steps:
      - name: Get latest upstream release tag
        id: upstream
        run: |
          echo "=== ncnn upstream release check ==="
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Repository: ${{ env.NCNN_REPO }}"
          echo ""
          
          RESPONSE=$(curl -sf https://api.github.com/repos/${{ env.NCNN_REPO }}/releases/latest)
          if [ $? -ne 0 ]; then
            echo "ERROR: Failed to fetch releases from GitHub API"
            exit 1
          fi
          
          TAG=$(echo "$RESPONSE" | jq -r '.tag_name')
          PUBLISHED=$(echo "$RESPONSE" | jq -r '.published_at')
          URL=$(echo "$RESPONSE" | jq -r '.html_url')
          
          echo "Upstream tag: $TAG"
          echo "Published: $PUBLISHED"
          echo "Release URL: $URL"
          
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "ERROR: Could not extract tag_name from response"
            exit 1
          fi
          
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo ""

      - name: Get last built tag from GHCR
        id: builtin
        run: |
          echo "=== GHCR tag check ==="
          IMAGE="${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"
          TAGS=$(curl -sf "https://ghcr.io/v2/${IMAGE}/tags/list" 2>/dev/null || echo "")
          
          if [ -z "$TAGS" ]; then
            echo "No existing tags found in GHCR (first build)"
            echo "tag=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          echo "Existing tags:"
          echo "$TAGS" | jq -r '.tags[]' 2>/dev/null || echo "$TAGS"
          echo ""
          
          BUILT=$(echo "$TAGS" | grep -oP 'ncnn-\K[0-9]+' | sort -V | tail -1)
          echo "Latest built ncnn version: ${BUILT:-none}"
          echo "tag=${BUILT:-none}" >> "$GITHUB_OUTPUT"
          echo ""

      - name: Compare tags
        if: steps.upstream.outcome == 'success'
        run: |
          echo "=== Tag comparison ==="
          UPSTREAM="${{ steps.upstream.outputs.tag }}"
          BUILT="${{ steps.builtin.outputs.tag }}"
          echo "Upstream ncnn: $UPSTREAM"
          echo "Built ncnn:    $BUILT"
          
          if [ "$UPSTREAM" = "$BUILT" ]; then
            echo "Status: UP TO DATE"
          else
            echo "Status: NEW NCNN RELEASE AVAILABLE"
          fi
          echo ""

      - name: Trigger yolo-rest build
        if: steps.upstream.outputs.tag != steps.builtin.outputs.tag
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          echo "=== Triggering yolo-rest build ==="
          echo "ncnn tag: $TAG"
          
          PAYLOAD=$(jq -n \
            --arg tag "$TAG" \
            '{event_type: "ncnn-release", client_payload: {ncnn_tag: $tag}}')
          
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d "$PAYLOAD")
          
          if [ "$HTTP_CODE" = "204" ]; then
            echo "Build triggered successfully (HTTP $HTTP_CODE)"
          else
            echo "ERROR: Failed to trigger build (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: No new release
        if: steps.upstream.outputs.tag == steps.builtin.outputs.tag
        run: |
          echo "=== No action needed ==="
          echo "ncnn ${{ steps.upstream.outputs.tag }} already built"
